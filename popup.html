<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Optimizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="app-title">Tab Optimizer</h1>
      <nav class="nav-tabs">
        <a href="popup.html" class="nav-link active">Dashboard</a>
        <a href="stashes.html" class="nav-link">Stashes</a>
        <a href="settings.html" class="nav-link">Settings</a>
      </nav>
    </header>

    <main class="content">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-main">
            <span class="stat-value" id="open-tabs-count">0</span>
            <svg class="stat-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="12 6 12 12 16 14"></polygon>
            </svg>
          </div>
          <span class="stat-label">Open Tabs</span>
        </div>

        <div class="stat-card">
          <div>
            <span class="stat-value" id="frozen-tabs-count">0</span>
            <div class="stat-sub">saved for 2h</div>
          </div>
          <span class="stat-label">Frozen</span>
        </div>

        <div class="stat-card">
          <div class="stat-main">
            <span class="stat-value" id="memory-saved">0 MB</span>
          </div>
          <svg class="sparkline-chart" viewBox="0 0 100 25" preserveAspectRatio="none">
            <path d="M0,20 Q15,14 30,8 T60,14 T80,4 T100,10" fill="none" stroke="var(--accent-blue)" stroke-width="2.5"/>
            <path d="M0,20 Q15,14 30,8 T60,14 T80,4 T100,10 L100,25 L0,25 Z" fill="var(--sparkline-fill)" opacity="0.2"/>
          </svg>
          <span class="stat-label">RAM Recovered</span>
        </div>
      </div>

      <div class="actions">
        <button id="btn-group-tabs" class="action-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            <line x1="12" y1="11" x2="12" y2="17"></line>
            <line x1="9" y1="14" x2="15" y2="14"></line>
          </svg>
          <span>Auto-Group Now</span>
        </button>
        <button id="btn-freeze-all" class="action-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="2" x2="12" y2="22"></line>
            <line x1="20" y1="6" x2="4" y2="18"></line>
            <line x1="20" y1="18" x2="4" y2="6"></line>
          </svg>
          <span>Freeze Inactive</span>
        </button>
      </div>

      <div class="tab-list-header">
        <h2 class="section-title">Current Tabs</h2>
        <button id="btn-stash-all" class="btn-stash-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="21 8 21 21 3 21 3 8"></polyline>
            <rect x="1" y="3" width="22" height="5"></rect>
            <line x1="10" y1="12" x2="14" y2="12"></line>
          </svg>
          <span>Stash All</span>
        </button>
      </div>
      
      <div id="tab-list" class="tab-list">
        <!-- Tabs will be rendered here via JS -->
      </div>
    </main>

    <footer class="footer">
      <span class="version">v2.1</span>
      <span class="credit">Made with care by Tab Optimizer</span>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
