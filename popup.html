<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Tab Stash & Auto-Group</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        <h1>Tab Optimizer</h1>
      </div>
      <nav class="nav-tabs">
        <a href="popup.html" class="nav-btn active">Dashboard</a>
        <a href="stashes.html" class="nav-btn">Stashes</a>
        <a href="settings.html" class="nav-btn">Settings</a>
      </nav>
    </header>

    <main class="content">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Open Tabs</span>
          <span class="stat-value" id="open-tabs-count">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Frozen</span>
          <span class="stat-value" id="frozen-tabs-count">0</span>
        </div>
        <div class="stat-card highlight">
          <span class="stat-label">Memory Saved</span>
          <span class="stat-value" id="memory-saved">0 MB</span>
        </div>
      </div>

      <div class="actions">
        <button id="btn-group-tabs" class="btn primary">Auto-Group Tabs Now</button>
        <button id="btn-freeze-all" class="btn secondary">Freeze Inactive</button>
      </div>

      <div class="tab-list-header">
        <h3>Current Tabs</h3>
        <button id="btn-stash-all" class="btn small outline">Stash All</button>
      </div>
      
      <div id="tab-list" class="tab-list">
        <!-- Tabs will be rendered here via JS -->
      </div>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
