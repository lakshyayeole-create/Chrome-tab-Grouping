<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Optimizer - Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="app-title">Tab Optimizer</h1>
      <nav class="nav-tabs">
        <a href="popup.html" class="nav-link">Dashboard</a>
        <a href="stashes.html" class="nav-link">Stashes</a>
        <a href="settings.html" class="nav-link active">Settings</a>
      </nav>
    </header>

    <main class="content">
      <div class="tab-list-header">
        <h2 class="section-title">Extension Settings</h2>
      </div>
      
      <div class="settings-group">
        <label class="setting-item">
          <span class="setting-label">Auto-Group Tabs on Open</span>
          <input type="checkbox" id="auto-group-toggle">
        </label>
        
        <label class="setting-item">
          <span class="setting-label">Enable Auto-Freeze</span>
          <input type="checkbox" id="auto-freeze-toggle">
        </label>
        
        <div class="setting-item vertical">
          <span class="setting-label">Inactivity Threshold (Minutes)</span>
          <input type="number" id="freeze-threshold" min="1" max="1440" value="30">
          <span class="setting-desc">Tabs inactive for this long will be discarded to save RAM.</span>
        </div>
      </div>

      <div class="settings-group">
        <div class="setting-item vertical">
          <span class="setting-label">Whitelist Domains (comma separated)</span>
          <textarea id="whitelist-domains" rows="3" placeholder="youtube.com, mydomain.com"></textarea>
          <span class="setting-desc">These domains will never be automatically frozen.</span>
        </div>
      </div>

      <button id="btn-save-settings" class="action-btn primary-save">Save Settings</button>
      <div id="save-status" class="status-msg"></div>
    </main>

    <footer class="footer">
      <span class="version">v2.1</span>
      <span class="credit">Made with care by Tab Optimizer</span>
    </footer>
  </div>
  <script type="module" src="settings.js"></script>
</body>
</html>
